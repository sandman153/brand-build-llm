name: Manage GCP Resources with Terraform

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Action to perform: deploy or destroy'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy

jobs:
  enable-apis:
    name: Enable Required APIs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up GCP SDK
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Enable Service Usage API
        run: gcloud services enable serviceusage.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Enable IAM API
        run: gcloud services enable iam.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Enable Pub/Sub API
        run: gcloud services enable pubsub.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Enable Cloud Functions API
        run: gcloud services enable cloudfunctions.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Enable Cloud Scheduler API
        run: gcloud services enable cloudscheduler.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Enable Storage API
        run: gcloud services enable storage.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Enable Cloud Resource Manager API
        run: gcloud services enable cloudresourcemanager.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}

  terraform-operations:
    name: Terraform Operations
    runs-on: ubuntu-latest
    needs: enable-apis
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up GCP SDK for Terraform
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Import Existing Resources
        run: |
          # Import existing resources into Terraform state
          terraform import google_service_account.gemini_service_account projects/${{ secrets.GCP_PROJECT_ID }}/serviceAccounts/gemini-service-account@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com || true
          terraform import google_pubsub_topic.gemini_topic projects/${{ secrets.GCP_PROJECT_ID }}/topics/gemini-topic || true
          terraform import google_storage_bucket.infra_rss_summarizer your-bucket-name || true

      - name: Terraform Init
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: "${{ secrets.GCP_REGION || 'australia-southeast1' }}"
          TF_VAR_zone: "${{ secrets.GCP_ZONE || 'australia-southeast1-a' }}"
          TF_VAR_credentials: ${{ secrets.GCP_SA_KEY }}
        run: terraform -chdir="./iac-terraform/environments/prod" init -input=false -reconfigure

      - name: Terraform Plan
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: "${{ secrets.GCP_REGION || 'australia-southeast1' }}"
          TF_VAR_zone: "${{ secrets.GCP_ZONE || 'australia-southeast1-a' }}"
          TF_VAR_credentials: ${{ secrets.GCP_SA_KEY }}
        run: terraform -chdir="./iac-terraform/environments/prod" plan -input=false -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v2
        with:
          name: tfplan
          path: ./iac-terraform/environments/prod/tfplan

  deploy-resources:
    name: Deploy Resources
    runs-on: ubuntu-latest
    needs: terraform-operations
    if: ${{ github.event.inputs.action == 'deploy' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up GCP SDK for Terraform Apply
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: T
