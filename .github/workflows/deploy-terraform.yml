name: Deploy Terraform with GCP

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Action to perform: deploy or destroy'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy

jobs:
  install-terraform:
    name: Install Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest

  enable-apis:
    name: Enable Required APIs
    runs-on: ubuntu-latest
    needs: install-terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up GCP SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Enable Service Usage API
        run: gcloud services enable serviceusage.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Enable Other Required APIs
        run: |
          gcloud services enable iam.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}
          gcloud services enable pubsub.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}
          gcloud services enable cloudfunctions.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}
          gcloud services enable cloudscheduler.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}
          gcloud services enable storage.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}

  terraform-operations:
    name: Terraform Operations
    runs-on: ubuntu-latest
    needs: enable-apis
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Terraform Init
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: terraform -chdir="./iac-terraform/environments/prod" init -input=false -reconfigure

      - name: Terraform Plan
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: terraform -chdir="./iac-terraform/environments/prod" plan -input=false -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v2
        with:
          name: tfplan
          path: ./iac-terraform/environments/prod/tfplan

  deploy-resources:
    name: Deploy Resources
    runs-on: ubuntu-latest
    needs: terraform-operations
    if: ${{ github.event.inputs.action == 'deploy' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Terraform Init (Re-run)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: terraform -chdir="./iac-terraform/environments/prod" init -input=false -reconfigure

      - name: Download Terraform Plan
        uses: actions/download-artifact@v2
        with:
          name: tfplan
          path: ./iac-terraform/environments/prod/tfplan

      - name: Terraform Apply
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: terraform -chdir="./iac-terraform/environments/prod" apply -input=false -auto-approve

  destroy-resources:
    name: Destroy Resources
    runs-on: ubuntu-latest
    needs: terraform-operations
    if: ${{ github.event.inputs.action == 'destroy' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Terraform Init
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: terraform -chdir="./iac-terraform/environments/prod" init -input=false -reconfigure

      - name: Terraform Destroy
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: terraform -chdir="./iac-terraform/environments/prod" destroy -input=false -auto-approve
