name: Deploy Terraform with GCP2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Action to perform: deploy or destroy'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy

jobs:
  enable-apis:
    name: Enable Required APIs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up GCP SDK
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Enable Service Usage API
        run: gcloud services enable serviceusage.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Enable IAM API
        run: gcloud services enable iam.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Enable Pub/Sub API
        run: gcloud services enable pubsub.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Enable Cloud Functions API
        run: gcloud services enable cloudfunctions.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Enable Cloud Scheduler API
        run: gcloud services enable cloudscheduler.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Enable Storage API
        run: gcloud services enable storage.googleapis.com --project=${{ secrets.GCP_PROJECT_ID }}

  terraform-operations:
    name: Terraform Operations
    runs-on: ubuntu-latest
    needs: enable-apis
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up GCP SDK for Terraform
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Init
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: terraform -chdir="./iac-terraform/environments/prod" init -input=false -reconfigure

      - name: Terraform Plan
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: terraform -chdir="./iac-terraform/environments/prod" plan -input=false -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v2
        with:
          name: tfplan
          path: ./iac-terraform/environments/prod/tfplan

  deploy-resources:
    name: Deploy Resources
    runs-on: ubuntu-latest
    needs: terraform-operations
    if: ${{ github.event.inputs.action == 'deploy' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up GCP SDK for Terraform Apply
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@v2
        with:
          name: tfplan
          path: ./iac-terraform/environments/prod/tfplan

      - name: Terraform Apply
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: terraform -chdir="./iac-terraform/environments/prod" apply -input=false -auto-approve

  destroy-resources:
    name: Destroy Resources
    runs-on: ubuntu-latest
    needs: terraform-operations
    if: ${{ github.event.inputs.action == 'destroy' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up GCP SDK for Terraform Destroy
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Destroy
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
        run: terraform -chdir="./iac-terraform/environments/prod" destroy -input=false -auto-approve
